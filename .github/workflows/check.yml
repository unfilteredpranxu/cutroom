name: Cutroom checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip
      - run: npm run typecheck
      - run: npm test
      - name: Select the Chromium browser
        run: |
          if command -v google-chrome >/dev/null; then
            printf 'CUTROOM_CHROMIUM_PATH=%s\n' "$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npm exec -- playwright install --with-deps chromium
          fi
      - run: npm run test:e2e
      - run: npm run check:pages
      - run: npm run deploy:worker -- --dry-run --outdir /tmp/cutroom-worker
      - run: npm exec -- wrangler pages functions build functions --outdir /tmp/cutroom-pages --compatibility-date 2026-11-20
