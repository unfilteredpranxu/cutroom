name: Cutroom checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip
      - run: npm run typecheck
      - run: npm test
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run deploy:worker -- --dry-run --outdir /tmp/cutroom-worker
      - run: npm exec -- wrangler pages functions build functions --outdir /tmp/cutroom-pages --compatibility-date 2026-11-20
